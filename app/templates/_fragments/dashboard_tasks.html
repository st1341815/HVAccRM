{% if tasks %}
<table class="tight">
  <thead><tr><th>计划完成</th><th>客户</th><th>工序</th><th>状态</th></tr></thead>
  <tbody>
  {% for t in tasks %}
    <tr class="{{ 'row-alert' if t.planned_end and t.planned_end < today and t.status not in ['done','skipped'] else '' }}">
      <td>{{ t.planned_end or '-' }}</td>
      <td>{% if customers.get(t.customer_id) %}<a href="/customers/{{ t.customer_id }}?tab=tasks">{{ customers[t.customer_id].name }}</a>{% else %}#{{ t.customer_id }}{% endif %}</td>
      <td>{{ t.stage }}</td>
      <td>{{ status_labels.get(t.status, t.status) }}</td>
    </tr>
  {% endfor %}
  </tbody>
</table>
{% else %}
<p class="muted">没有待办工序。</p>
{% endif %}

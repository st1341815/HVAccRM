{% extends "layout.html" %}
{% block title %}登录{% endblock %}
{% block content %}
<div class="login-card">
  <h1>🌡️ HVAccRM</h1>
  <p class="muted">暖通空调客户管理系统 · 内网自用 · 请使用管理员分配的账号登录</p>
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next or '/' }}">
    <label>账号<input name="username" value="{{ username or '' }}" required autofocus autocomplete="username"></label>
    <label>密码<input type="password" name="password" required autocomplete="current-password"></label>
    {% if need_totp %}
    <label>动态验证码（6 位数字）
      <input name="totp" inputmode="numeric" autocomplete="one-time-code" placeholder="6 位数字" autofocus>
    </label>
    {% endif %}
    {% if need_sms %}
    <div class="sms-field">
      <label>短信验证码（外网登录需要）
        <span class="sms-row">
          <input name="sms_code" inputmode="numeric" autocomplete="one-time-code" placeholder="6 位数字" pattern="[0-9]{6}">
          <button type="submit" formaction="/login/sms/send" class="ghost sms-send" id="smsSendBtn">获取验证码</button>
        </span>
      </label>
      <p class="muted small">当前为外网访问，需短信验证后登录。点击「获取验证码」前请先填写上方账号和密码。</p>
    </div>
    {% endif %}
    <button type="submit">登录</button>
  </form>
</div>
{% if need_sms %}
<script>
(function () {
  var btn = document.getElementById('smsSendBtn');
  if (!btn) return;
  btn.addEventListener('click', function () {
    if (btn.disabled) return false;
    var form = btn.closest('form');
    if (!form || !form.checkValidity()) return; // 让浏览器先完成必填校验
    var left = 60;
    btn.disabled = true;
    btn.dataset.label = btn.textContent;
    btn.textContent = left + ' 秒后可重发';
    var timer = setInterval(function () {
      left -= 1;
      if (left <= 0) {
        clearInterval(timer);
        btn.disabled = false;
        btn.textContent = btn.dataset.label || '获取验证码';
      } else {
        btn.textContent = left + ' 秒后可重发';
      }
    }, 1000);
    // 注意：不阻止默认提交——按钮 formaction 会把整个表单（含账号密码）提交到 /login/sms/send
  });
})();
</script>
{% endif %}
{% endblock %}

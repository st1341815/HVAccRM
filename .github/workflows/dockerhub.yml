name: Publish to Docker Hub

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve app version
        id: ver
        run: |
          V=$(grep -oP '__version__\s*=\s*"\K[0-9.]+' app/__init__.py)
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hvaccrm:${{ steps.ver.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/hvaccrm:latest

      - name: Check repository visibility
        run: |
          curl -fsSL "https://hub.docker.com/v2/repositories/${{ secrets.DOCKERHUB_USERNAME }}/hvaccrm/" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('is_private =', d.get('is_private'), '| pull_count =', d.get('pull_count'))"

      - name: Verify anonymous pull
        id: anon
        continue-on-error: true
        run: |
          docker logout
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/hvaccrm:${{ steps.ver.outputs.version }}

      - name: Report
        run: |
          echo "anonymous_pull=${{ steps.anon.outcome }}"
          if [ "${{ steps.anon.outcome }}" != "success" ]; then
            echo "::warning::匿名拉取失败——仓库可能是私有；如需公开拉取，请在 Docker Hub 将 ${{ secrets.DOCKERHUB_USERNAME }}/hvaccrm 设为 Public"
          fi

name: Publish to Docker Hub

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve app version
        id: ver
        run: |
          V=$(grep -oP '__version__\s*=\s*"\K[0-9.]+' app/__init__.py)
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Install test deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt -r requirements-test.txt

      - name: Run tests（门禁：测试不过不打镜像）
        run: pytest tests/ -q
        env:
          DB_PATH: ":memory:"
          CONFIG_DIR: ${{ runner.temp }}/cfg
          DATA_DIR: ${{ runner.temp }}/data

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hvaccrm:${{ steps.ver.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/hvaccrm:latest

      - name: Check repository visibility
        run: |
          curl -fsSL "https://hub.docker.com/v2/repositories/${{ secrets.DOCKERHUB_USERNAME }}/hvaccrm/" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('is_private =', d.get('is_private'), '| pull_count =', d.get('pull_count'))"

      - name: Verify anonymous pull
        id: anon
        continue-on-error: true
        run: |
          docker logout
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/hvaccrm:${{ steps.ver.outputs.version }}

      - name: Report
        run: |
          echo "anonymous_pull=${{ steps.anon.outcome }}"
          if [ "${{ steps.anon.outcome }}" != "success" ]; then
            echo "::warning::匿名拉取失败——仓库可能是私有；如需公开拉取，请在 Docker Hub 将 ${{ secrets.DOCKERHUB_USERNAME }}/hvaccrm 设为 Public"
          fi

      # Docker Hub 仓库页的 Description/Overview 不会自动跟随 GitHub README，
      # 这里把 docs/DockerHub-Overview.md 同步过去（失败不影响发镜像）。
      - name: Sync Docker Hub overview
        continue-on-error: true
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          user = os.environ["DH_USER"].strip()
          token = os.environ["DH_TOKEN"].strip()
          overview = open("docs/DockerHub-Overview.md", encoding="utf-8").read()

          # 搜索结果里显示的短描述（Docker Hub 限 100 字符）
          short = "暖通空调客户管理系统：楼盘房号·合同收款·成本利润·施工工序·对外案例。FastAPI + SQLite，自托管，PWA。"[:100]

          login = urllib.request.Request(
              "https://hub.docker.com/v2/users/login/",
              data=json.dumps({"username": user, "password": token}).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          jwt = json.loads(urllib.request.urlopen(login, timeout=30).read())["token"]

          patch = urllib.request.Request(
              f"https://hub.docker.com/v2/repositories/{user}/hvaccrm/",
              data=json.dumps({"full_description": overview, "description": short}).encode(),
              headers={"Authorization": f"JWT {jwt}", "Content-Type": "application/json"},
              method="PATCH",
          )
          with urllib.request.urlopen(patch, timeout=30) as resp:
              print(f"overview synced: HTTP {resp.status}, {len(overview)} chars")
          PY

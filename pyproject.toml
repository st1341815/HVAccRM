[project]
name = "onecrm"
version = "1.5.3"
description = "HVAccRM — 暖通空调客户管理系统，NAS 自托管版"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "jinja2==3.1.5",
    "python-multipart==0.0.20",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "apscheduler==3.11.0",
    "pydantic-settings==2.7.0",
    "pillow==11.1.0",
    "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# pytest 发现 / 运行配置
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-ra", "--strict-markers"]
# 沙箱全局 PYTHONPATH 污染（pydantic_core 是坏的）：在 venv 里开发可正常 import，
# CI / 开发机若撞同一问题，临时方案：
#   PYTHONPATH=.venv/bin/python .venv/bin/python -m pytest tests/
filterwarnings = [
    "ignore::DeprecationWarning",
]
